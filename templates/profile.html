<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="navbar">
    <h2>SkillSwap</h2>
    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/skills">Skills</a>
        <a href="/matches">Matches</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="container">
    <h2>{{ user.name }}</h2>
    <p><strong>Email:</strong> {{ user.email }}</p>

    <h3>My Skills</h3>

    <ul>
        {% for s in skills %}
            <li>{{ s.skill_name }} — <b>{{ s.skill_type }}</b></li>
        {% else %}
            <li>No skills added yet</li>
        {% endfor %}
    </ul>
</div>

</body>
</html>
