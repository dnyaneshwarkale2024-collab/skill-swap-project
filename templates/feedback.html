{% extends 'base.html' %}

{% block content %}

<h2>Feedback Section</h2>

<form method="POST">
    <textarea name="message" placeholder="Write your feedback..." required></textarea><br><br>
    <button type="submit">Submit Feedback</button>
</form>

<hr>

<h3>Student Feedback</h3>

{% for fb in feedbacks %}
    <div style="border:1px solid #ccc; padding:10px; margin:10px;">
        <b>{{ fb.name }}</b> <br>
        {{ fb.message }} <br>
        <small>{{ fb.created_at }}</small>
    </div>
{% endfor %}

{% endblock %}
