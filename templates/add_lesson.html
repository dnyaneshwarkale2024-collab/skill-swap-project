<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Lesson | SkillSwap</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">SkillSwap</div>
    <div class="nav-links">
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('skills') }}">Skills</a>
        <a href="{{ url_for('matches') }}">Matches</a>
        <a href="{{ url_for('requests') }}">Requests</a>
        <div class="dropdown">
            <a href="#" class="dropdown-toggle">Learn <i class="fas fa-chevron-down"></i></a>
            <div class="dropdown-menu">
                <a href="{{ url_for('courses') }}">Courses</a>
                <a href="{{ url_for('study_materials') }}">Study Materials</a>
                <a href="{{ url_for('live_lectures') }}">Live Lectures</a>
                <a href="{{ url_for('projects') }}">Projects</a>
            </div>
        </div>
        <a href="{{ url_for('profile') }}">Profile</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</div>

<!-- FORM SECTION -->
<div class="container">
    <div class="form-container">
        <div class="form-header">
            <h1><i class="fas fa-video"></i> Add Lesson</h1>
            <p>Add a new lesson to your course.</p>
        </div>

        <form method="POST" class="form">
            <div class="form-group">
                <label for="title">Lesson Title *</label>
                <input type="text" id="title" name="title" required
                       placeholder="Enter lesson title">
            </div>

            <div class="form-group">
                <label for="description">Lesson Description *</label>
                <textarea id="description" name="description" rows="3" required
                          placeholder="Brief description of this lesson"></textarea>
            </div>

            <div class="form-group">
                <label for="content_type">Content Type *</label>
                <select id="content_type" name="content_type" required>
                    <option value="">Select content type</option>
                    <option value="video">Video</option>
                    <option value="text">Text/Article</option>
                    <option value="pdf">PDF Document</option>
                    <option value="link">External Link</option>
                </select>
            </div>

            <div class="form-group">
                <label for="content_url">Content URL *</label>
                <input type="url" id="content_url" name="content_url" required
                       placeholder="https://example.com/video or document link">
                <small class="form-help">Enter the URL where students can access this lesson content</small>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="duration">Duration (minutes)</label>
                    <input type="number" id="duration" name="duration" min="1"
                           placeholder="30">
                </div>
                <div class="form-group">
                    <label for="order_index">Order in Course</label>
                    <input type="number" id="order_index" name="order_index" min="1"
                           placeholder="1">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn">
                    <i class="fas fa-plus"></i> Add Lesson
                </button>
                <a href="{{ url_for('course_detail', course_id=course_id) }}" class="btn btn-outline">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
