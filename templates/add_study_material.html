<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Study Material | SkillSwap</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">SkillSwap</div>
    <div class="nav-links">
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('skills') }}">Skills</a>
        <a href="{{ url_for('matches') }}">Matches</a>
        <a href="{{ url_for('requests') }}">Requests</a>
        <div class="dropdown">
            <a href="#" class="dropdown-toggle">Learn <i class="fas fa-chevron-down"></i></a>
            <div class="dropdown-menu">
                <a href="{{ url_for('courses') }}">Courses</a>
                <a href="{{ url_for('study_materials') }}">Study Materials</a>
                <a href="{{ url_for('live_lectures') }}">Live Lectures</a>
                <a href="{{ url_for('projects') }}">Projects</a>
            </div>
        </div>
        <a href="{{ url_for('profile') }}">Profile</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</div>

<!-- FORM SECTION -->
<div class="container">
    <div class="form-container">
        <div class="form-header">
            <h1><i class="fas fa-upload"></i> Share Study Material</h1>
            <p>Share books, articles, theses, or reference materials with the community.</p>
        </div>

        <form method="POST" class="form">
            <div class="form-group">
                <label for="title">Material Title *</label>
                <input type="text" id="title" name="title" required
                       placeholder="Enter material title">
            </div>

            <div class="form-group">
                <label for="description">Description *</label>
                <textarea id="description" name="description" rows="3" required
                          placeholder="Brief description of this material"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="material_type">Material Type *</label>
                    <select id="material_type" name="material_type" required>
                        <option value="">Select type</option>
                        <option value="book">Book</option>
                        <option value="article">Article</option>
                        <option value="thesis">Thesis/Dissertation</option>
                        <option value="project">Project/Documentation</option>
                        <option value="reference">Reference Material</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" name="category" required>
                        <option value="">Select category</option>
                        <option value="Programming">Programming</option>
                        <option value="Data Science">Data Science</option>
                        <option value="Web Development">Web Development</option>
                        <option value="Mobile Development">Mobile Development</option>
                        <option value="Design">Design</option>
                        <option value="Business">Business</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Language">Language</option>
                        <option value="Science">Science</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="content_url">Material URL *</label>
                <input type="url" id="content_url" name="content_url" required
                       placeholder="https://example.com/book or document link">
                <small class="form-help">Link to the material (PDF, website, Google Drive, etc.)</small>
            </div>

            <div class="form-group">
                <label for="author">Author (optional)</label>
                <input type="text" id="author" name="author"
                       placeholder="Author name">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn">
                    <i class="fas fa-share"></i> Share Material
                </button>
                <a href="{{ url_for('study_materials') }}" class="btn btn-outline">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
